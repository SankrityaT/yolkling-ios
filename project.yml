name: Yolkling
options:
  bundleIdPrefix: com.yolkling
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode wrote these straight into the .pbxproj, which xcodegen regenerates.
    # They live here so the project stays reproducible.
    # The team that actually ships the app. Not the one the project was started
    # under — an app using Sign in with Apple cannot be transferred between App
    # Store Connect accounts, and transfers need a released version anyway, so
    # this ships fresh under the shipping team rather than being moved.
    DEVELOPMENT_TEAM: 94277H98XP
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
targets:
  Yolkling:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Yolkling
    dependencies:
      - target: YolklingWidgets
      - target: YolklingScreenTimeReport
      # App target ONLY. YolklingWidgets cherry-picks sources out of Yolkling/, so
      # anything in Core/Creature, Core/Cosmetics, Core/Rooms, Core/Widget,
      # Core/DesignSystem or SocialModels.swift compiles into the widget too — and the
      # widget must never see RevenueCat. Keep all SDK use inside Core/Subscription/.
      - package: RevenueCat
      # Customer Center: one-tap cancel / refund / plan change, in-app.
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios
        PRODUCT_NAME: Yolkling
        CODE_SIGN_ENTITLEMENTS: Yolkling/Yolkling.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Yolkling reads your steps and sleep so your yolk grows when you take care of yourself in real life."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Yolkling can add a little sample activity while you try out grow-by-living."
        INFOPLIST_KEY_CFBundleDisplayName: Yolkling
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan a friend's code to add them."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  YolklingWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - YolklingWidgets
      - path: Yolkling/Core/Focus/FocusActivityAttributes.swift
      - path: Yolkling/Core/DesignSystem
        excludes:
          - TypewriterText.swift
      - Yolkling/Core/Creature
      - Yolkling/Core/Cosmetics
      - Yolkling/Core/Rooms
      - Yolkling/Core/Widget
      - path: Yolkling/Core/Networking/SocialModels.swift
      - path: Yolkling/Features/Onboarding/CustomizeOptions.swift
      - path: Yolkling/Features/Room/RoomView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.Widgets
        PRODUCT_NAME: YolklingWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: YolklingWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: YolklingWidgets/YolklingWidgets.entitlements
        SKIP_INSTALL: YES
  YolklingScreenTimeReport:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ScreenTimeReport
      - path: Yolkling/Core/Health/ScreenTimeShare.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.ScreenTimeReport
        PRODUCT_NAME: YolklingScreenTimeReport
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScreenTimeReport/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ScreenTimeReport/ScreenTimeReport.entitlements
        SKIP_INSTALL: YES
  YolklingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - YolklingTests
    dependencies:
      - target: Yolkling
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.Tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  Yolkling:
    build:
      targets:
        Yolkling: all
        YolklingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YolklingTests
