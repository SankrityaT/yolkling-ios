name: Yolkling
options:
  bundleIdPrefix: com.yolkling
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode wrote these straight into the .pbxproj, which xcodegen regenerates.
    # They live here so the project stays reproducible.
    # The team that actually ships the app. Not the one the project was started
    # under — an app using Sign in with Apple cannot be transferred between App
    # Store Connect accounts, and transfers need a released version anyway, so
    # this ships fresh under the shipping team rather than being moved.
    DEVELOPMENT_TEAM: 94277H98XP
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
  # The shared creature layer (rendering + identity + cosmetics + design tokens).
  # Replaces the old "widget cherry-picks sources out of Yolkling/" arrangement for
  # everything creature-shaped, and is what the watch app builds against.
  # See Packages/YolklingCore/README.md.
  YolklingCore:
    path: Packages/YolklingCore
targets:
  Yolkling:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Yolkling
    dependencies:
      - target: YolklingWidgets
      - target: YolklingScreenTimeReport
      # DISABLED FOR 1.0. Re-enable for 1.1 by uncommenting this line.
      #
      # The watch app is finished, tested and merged (see docs/WATCH_APP.md), but
      # EMBEDDING it turns a first submission into a two-platform one: it needs
      # com.yolkling.ios.watchkitapp registered as an App ID, it needs Apple Watch
      # screenshots in App Store Connect, and it needs the watchOS platform (~4GB)
      # installed on whichever Mac archives. None of that is hard, all of it is
      # between us and being on the store.
      #
      # The YolklingCore package refactor that came with it STAYS. It is good and
      # it is what the app, widget and tests already build against.
      # - target: YolklingWatch
      - package: YolklingCore
      # App target ONLY. YolklingWidgets still cherry-picks sources out of Yolkling/
      # (Core/Rooms, Core/Widget, SocialModels.swift, ...), so those files compile into
      # the widget too — and the widget must never see RevenueCat. Keep all SDK use
      # inside Core/Subscription/.
      - package: RevenueCat
      # Customer Center: one-tap cancel / refund / plan change, in-app.
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios
        PRODUCT_NAME: Yolkling
        CODE_SIGN_ENTITLEMENTS: Yolkling/Yolkling.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Yolkling reads your steps and sleep so your yolk grows when you take care of yourself in real life."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Yolkling can add a little sample activity while you try out grow-by-living."
        INFOPLIST_KEY_CFBundleDisplayName: Yolkling
        # Declares the export-compliance answer in the binary so App Store Connect stops
        # holding every upload at "Missing Compliance" for a human to answer the same
        # question again. Build 3 stalled on exactly this.
        #
        # NO is correct: the only encryption is standard HTTPS provided by the OS, which
        # is exempt. No proprietary or non-standard cryptography anywhere.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan a friend's code to add them."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  YolklingWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # The creature layer (Core/Creature, Core/Cosmetics, colour/spacing/type tokens,
      # CustomizeOptions) used to be cherry-picked from Yolkling/ here; it now comes in
      # once through the YolklingCore package instead.
      - YolklingWidgets
      - path: Yolkling/Core/Focus/FocusActivityAttributes.swift
      - path: Yolkling/Core/DesignSystem
        excludes:
          - TypewriterText.swift
      - Yolkling/Core/Rooms
      - Yolkling/Core/Widget
      - path: Yolkling/Core/Networking/SocialModels.swift
      - path: Yolkling/Features/Room/RoomView.swift
    dependencies:
      - package: YolklingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.Widgets
        PRODUCT_NAME: YolklingWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: YolklingWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: YolklingWidgets/YolklingWidgets.entitlements
        SKIP_INSTALL: YES
  YolklingScreenTimeReport:
    # ExtensionKit, NOT a legacy app-extension. A DeviceActivityReport extension is an
    # ExtensionKit extension: it ships in $(EXTENSIONS_FOLDER_PATH) rather than PlugIns,
    # and its Info.plist declares EXAppExtensionAttributes / EXExtensionPointIdentifier
    # instead of the NSExtension pair. Built as an app-extension it embeds in the wrong
    # folder and the report never loads.
    #
    # This has to live HERE and not only in the .pbxproj. Havi fixed it by hand in Xcode,
    # which is the natural way to find it, but the .pbxproj is GENERATED from this file --
    # so the next `xcodegen generate` silently reverted it. Verified: regenerating with
    # `type: app-extension` drops every extensionkit-extension line and the embed phase.
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ScreenTimeReport
      - path: Yolkling/Core/Health/ScreenTimeShare.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.ScreenTimeReport
        PRODUCT_NAME: YolklingScreenTimeReport
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScreenTimeReport/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ScreenTimeReport/ScreenTimeReport.entitlements
        SKIP_INSTALL: YES
  # The Apple Watch companion app: a single-target watchOS app (no separate
  # extension target — that split died with watchOS 9). Embedded in the iOS app
  # via the target dependency above, so installing Yolkling offers the watch app.
  # It renders the creature entirely from YolklingCore and receives state from
  # the phone over WatchConnectivity (see docs/WATCH_APP.md).
  YolklingWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - YolklingWatch
    dependencies:
      - package: YolklingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.watchkitapp
        PRODUCT_NAME: YolklingWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.yolkling.ios
        INFOPLIST_KEY_CFBundleDisplayName: Yolkling
        # Base settings pin SUPPORTED_PLATFORMS to iphoneos for every other target;
        # this one really is a watch app.
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  YolklingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - YolklingTests
    dependencies:
      - target: Yolkling
      - package: YolklingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.Tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  Yolkling:
    build:
      targets:
        Yolkling: all
        YolklingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YolklingTests
