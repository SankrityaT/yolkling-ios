name: Yolkling
# Debug and Release ship. Dev is Debug signed with a personal team and a different bundle
# id, so the app can be run on a phone by someone who is not on the shipping team: Family
# Controls does not work in the simulator, so screen time can ONLY be tested on device.
configs:
  Debug: debug
  Dev: debug
  Release: release
options:
  bundleIdPrefix: com.yolkling
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    # The App Group belongs to one team, so a Dev build signed with another needs its own.
    # Referenced by every entitlements file and carried in each Info.plist as YolkAppGroup.
    YOLK_APP_GROUP: group.com.yolkling.ios
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "19"
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode wrote these straight into the .pbxproj, which xcodegen regenerates.
    # They live here so the project stays reproducible.
    # The team that actually ships the app. Not the one the project was started
    # under — an app using Sign in with Apple cannot be transferred between App
    # Store Connect accounts, and transfers need a released version anyway, so
    # this ships fresh under the shipping team rather than being moved.
    DEVELOPMENT_TEAM: 94277H98XP
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  configs:
    Dev:
      # Sankritya's own team. Family Controls is granted for DEVELOPMENT automatically to
      # any paid account, which is all a device test needs; the distribution entitlement
      # stays on the shipping team.
      DEVELOPMENT_TEAM: J94T84BVCP
      YOLK_APP_GROUP: group.com.sankiii.yolkdev
      # Read by ScreenTimeShare/WidgetSnapshot so the code picks the same group the
      # entitlements do. A generated Info.plist cannot carry an arbitrary key, so this is
      # a compile-time flag rather than a runtime lookup.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG YOLK_DEV
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
  # The shared creature layer (rendering + identity + cosmetics + design tokens).
  # Replaces the old "widget cherry-picks sources out of Yolkling/" arrangement for
  # everything creature-shaped, and is what the watch app builds against.
  # See Packages/YolklingCore/README.md.
  YolklingCore:
    path: Packages/YolklingCore
targets:
  Yolkling:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Yolkling
    dependencies:
      - target: YolklingWidgets
      - target: YolklingScreenTimeReport
      - target: YolklingDeviceActivityMonitor
      # DISABLED FOR 1.0. Re-enable for 1.1 by uncommenting this line.
      #
      # The watch app is finished, tested and merged (see docs/WATCH_APP.md), but
      # EMBEDDING it turns a first submission into a two-platform one: it needs
      # com.yolkling.ios.watchkitapp registered as an App ID, it needs Apple Watch
      # screenshots in App Store Connect, and it needs the watchOS platform (~4GB)
      # installed on whichever Mac archives. None of that is hard, all of it is
      # between us and being on the store.
      #
      # The YolklingCore package refactor that came with it STAYS. It is good and
      # it is what the app, widget and tests already build against.
      # - target: YolklingWatch
      - package: YolklingCore
      # App target ONLY. YolklingWidgets still cherry-picks sources out of Yolkling/
      # (Core/Rooms, Core/Widget, SocialModels.swift, ...), so those files compile into
      # the widget too — and the widget must never see RevenueCat. Keep all SDK use
      # inside Core/Subscription/.
      - package: RevenueCat
      # Customer Center: one-tap cancel / refund / plan change, in-app.
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios
        PRODUCT_NAME: Yolkling
        CODE_SIGN_ENTITLEMENTS: Yolkling/Yolkling.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Yolkling reads your steps and sleep so your yolk grows when you take care of yourself in real life."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Yolkling does not write to Health. This permission is requested only because HealthKit requires it to be declared."
        INFOPLIST_KEY_CFBundleDisplayName: Yolkling
        # Declares the export-compliance answer in the binary so App Store Connect stops
        # holding every upload at "Missing Compliance" for a human to answer the same
        # question again. Build 3 stalled on exactly this.
        #
        # NO is correct: the only encryption is standard HTTPS provided by the OS, which
        # is exempt. No proprietary or non-standard cryptography anywhere.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Yolkling uses the camera to scan a friend's QR code so you can add them as a friend. Nothing is recorded, saved, or sent anywhere."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.sankiii.yolkdev
          # Both can be installed at once, so they need different names on the home screen.
          INFOPLIST_KEY_CFBundleDisplayName: Yolk Dev
  YolklingWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # The creature layer (Core/Creature, Core/Cosmetics, colour/spacing/type tokens,
      # CustomizeOptions) used to be cherry-picked from Yolkling/ here; it now comes in
      # once through the YolklingCore package instead.
      - YolklingWidgets
      - path: Yolkling/Core/Focus/FocusActivityAttributes.swift
      - path: Yolkling/Core/DesignSystem
        excludes:
          - TypewriterText.swift
      - Yolkling/Core/Rooms
      - Yolkling/Core/Widget
      - path: Yolkling/Core/Networking/SocialModels.swift
      - path: Yolkling/Features/Room/RoomView.swift
    dependencies:
      - package: YolklingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.Widgets
        PRODUCT_NAME: YolklingWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: YolklingWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: YolklingWidgets/YolklingWidgets.entitlements
        SKIP_INSTALL: YES
      configs:
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.sankiii.yolkdev.Widgets
  YolklingScreenTimeReport:
    # ExtensionKit, NOT a legacy app-extension. A DeviceActivityReport extension is an
    # ExtensionKit extension: it ships in $(EXTENSIONS_FOLDER_PATH) rather than PlugIns,
    # and its Info.plist declares EXAppExtensionAttributes / EXExtensionPointIdentifier
    # instead of the NSExtension pair. Built as an app-extension it embeds in the wrong
    # folder and the report never loads.
    #
    # This has to live HERE and not only in the .pbxproj. Havi fixed it by hand in Xcode,
    # which is the natural way to find it, but the .pbxproj is GENERATED from this file --
    # so the next `xcodegen generate` silently reverted it. Verified: regenerating with
    # `type: app-extension` drops every extensionkit-extension line and the embed phase.
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ScreenTimeReport
      - path: Yolkling/Core/Health/ScreenTimeShare.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.ScreenTimeReport
        PRODUCT_NAME: YolklingScreenTimeReport
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScreenTimeReport/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ScreenTimeReport/ScreenTimeReport.entitlements
        SKIP_INSTALL: YES
      configs:
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.sankiii.yolkdev.ScreenTimeReport
  YolklingDeviceActivityMonitor:
    # A DeviceActivityMonitor extension is a plain NSExtension-based app-extension
    # (NSExtensionPointIdentifier com.apple.deviceactivity.monitor-extension), NOT
    # ExtensionKit like ScreenTimeReport's DeviceActivityReport. It ships in PlugIns,
    # same as YolklingWidgets. Built as extensionkit-extension it would embed under
    # Extensions/ and the system would never call it.
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - DeviceActivityMonitor
      # The App Group contract, compiled into both sides. The extension writes it and
      # the app reads it; they must agree on the keys and the ladder's event names.
      - path: Yolkling/Core/Health/ScreenTimeShare.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.DeviceActivityMonitor
        PRODUCT_NAME: YolklingDeviceActivityMonitor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DeviceActivityMonitor/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitor/DeviceActivityMonitor.entitlements
        SKIP_INSTALL: YES
      configs:
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.sankiii.yolkdev.DeviceActivityMonitor
  # The Apple Watch companion app: a single-target watchOS app (no separate
  # extension target — that split died with watchOS 9). Embedded in the iOS app
  # via the target dependency above, so installing Yolkling offers the watch app.
  # It renders the creature entirely from YolklingCore and receives state from
  # the phone over WatchConnectivity (see docs/WATCH_APP.md).
  YolklingWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - YolklingWatch
    dependencies:
      - package: YolklingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.watchkitapp
        PRODUCT_NAME: YolklingWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.yolkling.ios
        INFOPLIST_KEY_CFBundleDisplayName: Yolkling
        # Base settings pin SUPPORTED_PLATFORMS to iphoneos for every other target;
        # this one really is a watch app.
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  YolklingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - YolklingTests
    dependencies:
      - target: Yolkling
      - package: YolklingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yolkling.ios.Tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  Yolkling:
    build:
      targets:
        Yolkling: all
        YolklingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YolklingTests

schemes:
  Yolkling:
    build:
      targets:
        Yolkling: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YolklingTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Run this one on a personal device. Same code, personal team, own bundle id and App
  # Group, so it installs ALONGSIDE the App Store app instead of replacing it.
  Yolkling Dev:
    build:
      targets:
        Yolkling: all
    run:
      config: Dev
    test:
      config: Dev
      targets:
        - YolklingTests
    profile:
      config: Dev
    analyze:
      config: Dev
    archive:
      config: Dev
